<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors · Jordan Lee Bagiw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <a class="back" href="../index.html">← Back</a>
  <header class="hud">
    <div class="hud-item"><span>You</span><b id="sYou">0</b></div>
    <div class="hud-item"><span>Rounds</span><b id="sRounds">0 / 3</b></div>
    <div class="hud-item"><span>CPU</span><b id="sCPU">0</b></div>
    <button class="icon-btn" id="settingsBtn">⚙</button>
  </header>

  <div class="arena">
    <div class="fighter" id="you"><span>?</span></div>
    <div class="vs">VS</div>
    <div class="fighter cpu" id="cpu"><span>?</span></div>
  </div>

  <div class="status" id="status">Pick your weapon</div>

  <div class="choices">
    <button class="choice" data-c="rock">✊<span>Rock</span></button>
    <button class="choice" data-c="paper">✋<span>Paper</span></button>
    <button class="choice" data-c="scissors">✌<span>Scissors</span></button>
  </div>

  <button class="btn reset" id="resetBtn">Reset Match</button>
</div>

<div class="modal" id="settings" hidden>
  <div class="modal-card">
    <header><h3>Settings</h3><button id="closeSettings">×</button></header>
    <label>Match length
      <select id="setBest">
        <option value="1">First to 1</option>
        <option value="3" selected>First to 3</option>
        <option value="5">First to 5</option>
      </select>
    </label>
    <label>CPU style
      <select id="setStyle">
        <option value="random" selected>Random</option>
        <option value="streak">Reacts to your last move</option>
      </select>
    </label>
    <button class="btn" id="saveSettings">Save &amp; Reset</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
